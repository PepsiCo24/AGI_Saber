# 对话模型配置
llm:
  api_url: https://ark.cn-beijing.volces.com/api/v3/chat/completions
  api_key: "your-key"               #  API Key
  model: ep-20260430233018-tqktj
  temperature: 0.7

# 向量模型配置
embedding:
  api_url: https://ark.cn-beijing.volces.com/api/v3/embeddings/multimodal
  api_key: "your-key"               # API Key
  model: ep-20260119190844-zzrq7

# 向量数据库配置
milvus:
  host: localhost
  port: 19530

# 关系型数据库配置
postgres:
  host: localhost
  port: 5432
  user: aiagent
  password: aiagent123
  database: aiagent

elasticsearch:
  addresses:
    - http://localhost:9200
  username: elastic
  password: changeme

kafka:
  brokers:
    - localhost:29092
  topic: agent-events

#rag策略
rag:
  chunk_size: 200
  chunk_overlap: 50
  top_k: 3
  rrf_constant_k: 60
  semantic_weight: 0.7
  enable_hybrid_search: true
  rag_milvus_dim: 2048

memory:
  short_term_max_turns: 5
  long_term_top_k: 3
  consolidation:
    similarity_threshold: 0.80   # 合并阈值：超过此相似度的记忆会被合并
    dedup_threshold: 0.95        # 去重阈值：超过此相似度的记忆视为重复
    ttl_days: 30                 # 过期天数：超过此天数的低重要性记忆会被淘汰
    decay_rate: 0.995            # 每日衰减系数（0.995 = 每天保留 99.5%）
    min_importance: 0.3          # 低于此重要性 + 超 TTL 的记忆会被淘汰
    trigger_interval: 5          # 每存入 N 条新记忆后触发合并

harness:
  max_reries: 3
  retry_delay_ms: 200
  step_timeout_ms: 5000
  max_iterations: 5

server:
  port: "8090"

# 可选：接入 Tavily 搜索 API（https://tavily.com 免费额度 1000次/月）
# 未填写时自动降级为 LLM 知识库回答
search:
  api_key: "your-key"               # 请填入你的 Tavily API Key（可选）
  api_url: "https://tavily.com"
